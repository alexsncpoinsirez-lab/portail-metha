<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portail Métha</title>
  <meta name="theme-color" content="#05080f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Portail Métha">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Saira+Extra+Condensed:wght@800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script src="intro.js"></script>
  <header class="barre">
    <button class="btn-retour" id="btnRetour" aria-label="Retour" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <img class="barre-logo" src="icons/icon-192.png" alt="" width="34" height="34">
    <div class="barre-titre">
      <div class="barre-nom" id="titre">Portail Métha</div>
      <div class="barre-sous" id="sousTitre"></div>
    </div>
    <div class="etat-sync" id="etatSync" title="État de la connexion"></div>
    <button class="btn-icone" id="btnReglages" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main id="vue" class="vue"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="rondes.js"></script>
  <script src="nh3.js"></script>
  <script src="bougies.js"></script>
  <script src="agitation.js"></script>
  <script src="analyses.js"></script>
  <script src="pompes.js"></script>
</body>
</html>
